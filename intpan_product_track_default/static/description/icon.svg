<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f5f86"/>
      <stop offset="1" stop-color="#5b3a63"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e2ee"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="52" fill="url(#bg)"/>

  <!-- carton box -->
  <g transform="translate(128 132)">
    <!-- box body -->
    <path d="M -58 -20 L 0 -46 L 58 -20 L 58 40 L 0 66 L -58 40 Z" fill="url(#box)"/>
    <!-- left face shadow -->
    <path d="M -58 -20 L 0 6 L 0 66 L -58 40 Z" fill="#cfc3d8"/>
    <!-- right face shadow -->
    <path d="M 58 -20 L 0 6 L 0 66 L 58 40 Z" fill="#ded3e6"/>
    <!-- top flaps -->
    <path d="M -58 -20 L 0 -46 L 0 6 Z" fill="#f6f2f8"/>
    <path d="M 58 -20 L 0 -46 L 0 6 Z" fill="#efe8f3"/>
    <!-- tape line -->
    <path d="M 0 -46 L 0 6" stroke="#b9a8c6" stroke-width="3"/>
  </g>

  <!-- check badge -->
  <g transform="translate(180 176)">
    <circle r="34" fill="#3fbf6b" stroke="#ffffff" stroke-width="6"/>
    <path d="M -15 2 L -4 14 L 17 -12" fill="none" stroke="#ffffff"
          stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
